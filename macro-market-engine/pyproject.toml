[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mme"
version = "0.1.0"
description = "Macro-to-Market Engine reusable core (ingestion + financial TS + quality)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "fredapi>=0.5.1",
    "yfinance>=0.2.40",
    "pandas-datareader>=0.10",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "hmmlearn>=0.3.0", "statsmodels>=0.14", "xgboost>=2.0", "shap>=0.44", "mlflow>=2.9"]
dev = ["pytest>=8.0", "pyarrow>=14.0"]

[tool.setuptools.packages.find]
where = ["src"]