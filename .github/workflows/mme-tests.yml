name: Macro Market Engine tests

on:
  push:
    paths:
      - "macro-market-engine/**"
  pull_request:
    paths:
      - "macro-market-engine/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: macro-market-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyarrow
      - name: pytest
        run: python -m pytest -q